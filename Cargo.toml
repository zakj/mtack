[package]
name = "mtack"
version = "0.1.0"
edition = "2024"
description = "Terminal multiplexer for dev workflows"
license = "MIT"
repository = "https://github.com/zakj/mtack"

[profile.release]
lto = true
codegen-units = 1
strip = true

[profile.profiling]
inherits = "release"
strip = false
debug = 2

[dependencies]
bytes = "1"
clap = { version = "4.5.60", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = "0.3.32"
kdl = "6"
miette = { version = "7.6.0", features = ["fancy"] }
nix = { version = "0.31.2", features = ["signal", "process"] }
pty-process = { version = "0.5", features = ["async"] }
ratatui = "0.30"
tokio = { version = "1", features = ["full"] }
tui-term = "0.3"
vt100 = "0.16"

[dev-dependencies]
insta = "1"
proptest = "1"
tempfile = "3.26.0"
